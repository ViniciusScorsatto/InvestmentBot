name: Regression and PostgreSQL tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: investmentbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d investmentbot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: swing-lab/requirements.txt
      - run: python -m pip install -r swing-lab/requirements.txt
      - name: Unit regressions
        run: python scripts/test_unit.py
      - name: PostgreSQL migrations and concurrency
        env:
          TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/investmentbot_test
        run: python scripts/test_postgres.py
